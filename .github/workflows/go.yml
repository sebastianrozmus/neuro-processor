name: Go

on:
  push:
    branches: [ "main", "open-source" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Format
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Bench tools
      run: cd tools/bench && python3 -m unittest test_tools
